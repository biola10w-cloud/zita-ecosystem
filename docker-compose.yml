version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zita-postgres
    environment:
      POSTGRES_USER:     zita
      POSTGRES_PASSWORD: zita_dev_password
      POSTGRES_DB:       zita_db
    ports: ['5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zita']
      interval: 5s; timeout: 5s; retries: 5

  redis:
    image: redis:7-alpine
    container_name: zita-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ['6379:6379']
    volumes: [redis_data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s; timeout: 3s; retries: 5

  api:
    build: { context: ./zita-backend, dockerfile: Dockerfile }
    container_name: zita-api
    ports: ['3000:3000']
    env_file: ./zita-backend/.env
    environment:
      DATABASE_URL: postgresql://zita:zita_dev_password@postgres:5432/zita_db
      REDIS_URL:    redis://redis:6379
    volumes: ['./zita-backend/keys:/app/keys:ro']
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  workers:
    build: { context: ./zita-backend, dockerfile: Dockerfile.workers }
    container_name: zita-workers
    env_file: ./zita-backend/.env
    environment:
      DATABASE_URL: postgresql://zita:zita_dev_password@postgres:5432/zita_db
      REDIS_URL:    redis://redis:6379
    volumes: ['./zita-backend/keys:/app/keys:ro']
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  admin:
    build: { context: ./zita-admin, dockerfile: Dockerfile }
    container_name: zita-admin
    ports: ['3001:3001']
    environment:
      NEXT_PUBLIC_API_URL: http://api:3000/api/v1
    depends_on: [api]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
