name: Flutter Mobile CI
on:
  push:
    branches: [main]
    paths: ['zita-app/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.16.x', channel: 'stable', cache: true }
      - run: flutter pub get
        working-directory: zita-app
      - run: flutter analyze
        working-directory: zita-app
      - run: flutter test
        working-directory: zita-app
