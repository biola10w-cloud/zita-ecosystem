worker_processes auto;
events { worker_connections 4096; use epoll; multi_accept on; }

http {
  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 75s; keepalive_requests 1000;
  gzip on; gzip_types application/json; gzip_min_length 1024;

  limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/m;
  limit_req_zone $binary_remote_addr zone=api:10m     rate=100r/m;
  limit_req_zone $binary_remote_addr zone=content:10m rate=30r/m;

  upstream api   { server localhost:3000; keepalive 32; }
  upstream admin { server localhost:3001; keepalive 16; }

  server {
    listen 80;
    server_name api.yourdomain.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    location /api/v1/auth/ {
      limit_req zone=auth burst=3 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/api/v1/books/.*/chapters/.*/content {
      limit_req zone=content burst=10 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    }

    location / {
      limit_req zone=api burst=20 nodelay;
      proxy_pass         http://api;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection '';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  server {
    listen 80;
    server_name admin.yourdomain.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name admin.yourdomain.com;
    ssl_certificate     /etc/letsencrypt/live/admin.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.3;

    location / {
      proxy_pass http://admin;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
