services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zita
      POSTGRES_PASSWORD: zita_dev_password
      POSTGRES_DB: zita_db
    ports:
      - "5432:5432"
    volumes:
      - zita_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  zita_postgres_data:
