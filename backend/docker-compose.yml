services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zita
      POSTGRES_PASSWORD: zita_dev_password
      POSTGRES_DB: zita_db
    ports:
      - "5432:5432"
    volumes:
      - zita_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zita -d zita_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://zita:zita_dev_password@postgres:5432/zita_db
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: npm run workers:start
    env_file: .env
    environment:
      DATABASE_URL: postgresql://zita:zita_dev_password@postgres:5432/zita_db
      REDIS_URL: redis://redis:6379
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  zita_postgres_data:
